# 本地开发依赖：PostgreSQL、Redis、RustFS（S3 兼容对象存储）。
# 与 Java 参考实现（/Users/johana/Desktop/facial-liveness-verification-j）共用同一套容器、凭据与数据卷，
# 两边可交替启动，不会互相覆盖数据。
# 启动：docker compose -f deploy/docker-compose.dev.yml up -d
# 说明：DDL 仅在数据卷首次初始化时按 FK 依赖顺序自动执行（单一来源 docs/需求/0001/sql/）。
services:
  postgres:
    image: postgres:16
    container_name: faceservice-postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../docs/需求/0001/sql:/sql:ro
      - ./initdb:/docker-entrypoint-initdb.d:ro
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-faceservice}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-faceservice_dev}
      POSTGRES_DB: ${POSTGRES_DB:-faceservice}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-faceservice} -d ${POSTGRES_DB:-faceservice}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: faceservice-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-faceservice_dev}"]
    ports:
      - "${REDIS_PORT:-16379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-faceservice_dev} ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  rustfs:
    image: rustfs/rustfs:latest
    container_name: faceservice-rustfs
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs-data:/data
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-faceservice}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-faceservice_dev_secret}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
    command: ["/data"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  # 显式命名，与 Java 版 compose 创建的卷一致（compose project name = deploy）
  postgres-data:
    name: deploy_faceservice_pgdata
  redis-data:
    name: deploy_faceservice_redis
  rustfs-data:
    name: deploy_faceservice_rustfs
